<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="flork-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff69b4" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background circular badge with soft galactic border -->
  <circle cx="120" cy="120" r="114" fill="#ffffff" stroke="#ff85c0" stroke-width="5" filter="url(#flork-glow)"/>
  
  <!-- Flork Body -->
  <g transform="translate(20, 15)">
    <!-- Base body curve -->
    <path d="M50,185 C50,110 55,60 100,55 C145,50 155,95 150,185" fill="#ffffff" stroke="#111111" stroke-width="5.5" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="95" cy="88" r="4.5" fill="#111111"/>
    <circle cx="122" cy="88" r="4.5" fill="#111111"/>
    
    <!-- Arms holding sign -->
    <!-- Left arm -->
    <path d="M60,135 Q40,140 32,130" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M142,135 Q162,140 168,130" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Sign board -->
    <g transform="rotate(-6, 100, 140)">
      <rect x="25" y="112" width="150" height="60" rx="8" fill="#ffffff" stroke="#111111" stroke-width="4.5"/>
      <!-- Text and Heart -->
      <text x="75" y="148" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">te amo</text>
      <path d="M125,142 C125,134 116,128 110,134 C104,140 106,148 125,160 C144,148 146,140 140,134 C134,128 125,134 125,142 Z" fill="#e8295b"/>
    </g>
  </g>
</svg>
