<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff79b0" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff65a3"/>
      <stop offset="100%" stop-color="#ff2e78"/>
    </linearGradient>
    <filter id="heart-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ff2e78" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Floating Heart -->
  <g class="floating-heart" filter="url(#heart-shadow)">
    <path d="M155,42 C155,28 140,16 128,26 C116,36 120,52 155,75 C190,52 194,36 182,26 C170,16 155,28 155,42 Z" fill="url(#heart-grad)"/>
    <ellipse cx="140" cy="30" rx="3.5" ry="6" transform="rotate(-30, 140, 30)" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Mocha (Brown Bear on the right) -->
  <g id="mocha">
    <!-- Body -->
    <path d="M165,130 C165,110 185,95 215,95 C250,95 275,120 270,165 C266,200 255,230 220,230 C190,230 170,215 165,170 Z" fill="#9c6d48" stroke="#3d2314" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Ears -->
    <!-- Left ear (hidden/partially visible) -->
    <path d="M188,102 C184,90 196,80 206,86 C214,92 210,105 204,106 Z" fill="#9c6d48" stroke="#3d2314" stroke-width="4"/>
    <path d="M192,98 C190,92 196,87 202,91 C206,94 204,101 200,102 Z" fill="#b98a63"/>

    <!-- Right ear -->
    <path d="M255,115 C268,110 278,122 274,134 C270,144 258,142 254,133 Z" fill="#9c6d48" stroke="#3d2314" stroke-width="4"/>
    <path d="M260,119 C267,116 272,123 270,130 C267,136 261,135 258,129 Z" fill="#b98a63"/>

    <!-- Head -->
    <ellipse cx="225" cy="142" rx="42" ry="38" fill="#9c6d48" stroke="#3d2314" stroke-width="4.5"/>

    <!-- Muzzle -->
    <ellipse cx="205" cy="155" rx="16" ry="13" fill="#b98a63"/>
    <!-- Nose -->
    <path d="M198,150 C201,147 207,147 210,150 C209,154 200,154 198,150 Z" fill="#3d2314"/>
    <!-- Mouth (shy straight line) -->
    <path d="M204,154 L204,162 M200,162 Q204,164 208,162" fill="none" stroke="#3d2314" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (worried / surprised cute dots) -->
    <ellipse cx="196" cy="138" rx="3.5" ry="5.5" fill="#3d2314"/>
    <ellipse cx="222" cy="142" rx="3.5" ry="5.5" fill="#3d2314"/>

    <!-- Sweat drop (cute shy detail!) -->
    <path d="M246,134 C243,130 248,123 251,126 C255,130 252,138 248,138 C245,138 243,136 246,134 Z" fill="#78d5ff" stroke="#3598c9" stroke-width="1.5"/>

    <!-- Blush -->
    <ellipse cx="186" cy="150" rx="6" ry="4" fill="#d9756c" opacity="0.5"/>
    <ellipse cx="236" cy="153" rx="6" ry="4" fill="#d9756c" opacity="0.5"/>

    <!-- Legs/Feet -->
    <path d="M190,225 C190,238 206,238 206,225" fill="#9c6d48" stroke="#3d2314" stroke-width="4"/>
    <path d="M232,225 C232,238 248,238 248,225" fill="#9c6d48" stroke="#3d2314" stroke-width="4"/>
  </g>

  <!-- Milk (White Bear on the left, jumping into hug) -->
  <g id="milk">
    <!-- Tail -->
    <ellipse cx="78" cy="195" rx="7" ry="7" fill="#ffffff" stroke="#2b232a" stroke-width="4"/>

    <!-- Left Ear -->
    <path d="M96,108 C88,96 102,84 113,92 C121,99 116,112 108,114 Z" fill="#ffffff" stroke="#2b232a" stroke-width="4"/>
    <path d="M100,105 C96,98 104,91 109,95 C113,99 110,107 106,108 Z" fill="#ffb4cf"/>

    <!-- Right Ear -->
    <path d="M144,115 C153,105 166,116 161,128 C156,137 145,133 143,124 Z" fill="#ffffff" stroke="#2b232a" stroke-width="4"/>
    <path d="M148,118 C153,112 159,118 156,124 C153,129 147,126 146,121 Z" fill="#ffb4cf"/>

    <!-- Body & Legs -->
    <path d="M98,165 C85,185 95,225 125,225 C145,225 158,210 162,185 C165,160 148,155 125,155 Z" fill="#ffffff" stroke="#2b232a" stroke-width="4.5" stroke-linejoin="round"/>
    
    <!-- Feet -->
    <path d="M104,222 C104,233 118,233 118,222" fill="#ffffff" stroke="#2b232a" stroke-width="4"/>
    <path d="M136,220 C136,233 150,233 150,220" fill="#ffffff" stroke="#2b232a" stroke-width="4"/>

    <!-- Head -->
    <ellipse cx="130" cy="138" rx="36" ry="34" transform="rotate(12, 130, 138)" fill="#ffffff" stroke="#2b232a" stroke-width="4.5"/>

    <!-- Eyes (Happy closed arcs ^ ^) -->
    <path d="M124,132 C128,125 136,126 139,134" fill="none" stroke="#2b232a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M148,136 C152,130 160,132 163,140" fill="none" stroke="#2b232a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="146" cy="144" rx="3.5" ry="2.5" fill="#2b232a"/>

    <!-- Open Happy Mouth -->
    <path d="M138,148 C141,160 155,162 157,150 Z" fill="#e84a6f" stroke="#2b232a" stroke-width="2.5"/>
    <path d="M142,154 C145,150 152,151 153,155 Z" fill="#ff8aa7"/>

    <!-- Blush -->
    <ellipse cx="120" cy="144" rx="6.5" ry="4" fill="#ff7da7" opacity="0.6"/>
    <ellipse cx="162" cy="149" rx="6.5" ry="4" fill="#ff7da7" opacity="0.6"/>

    <!-- Left Arm hugging Mocha tightly -->
    <path d="M136,168 C150,165 178,168 190,175 C196,179 194,188 185,188 C172,188 152,182 138,180 Z" fill="#ffffff" stroke="#2b232a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
