<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="flork-glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff69b4" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background circular badge with soft galactic border -->
  <circle cx="120" cy="120" r="114" fill="#ffffff" stroke="#ff85c0" stroke-width="5" filter="url(#flork-glow2)"/>
  
  <!-- Flork Body -->
  <g transform="translate(18, 15)">
    <!-- Base body curve -->
    <path d="M50,185 C50,110 55,60 100,55 C145,50 155,95 150,185" fill="#ffffff" stroke="#111111" stroke-width="5.5" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="95" cy="88" r="4.5" fill="#111111"/>
    <circle cx="122" cy="88" r="4.5" fill="#111111"/>
    
    <!-- Arms holding sign -->
    <path d="M60,135 Q38,140 30,130" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    <path d="M142,135 Q164,140 172,130" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Sign board -->
    <g transform="rotate(-3, 100, 140)">
      <rect x="18" y="105" width="168" height="74" rx="8" fill="#ffffff" stroke="#111111" stroke-width="4.5"/>
      <!-- Text and Heart -->
      <text x="102" y="125" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">vengo a recordarte</text>
      <text x="102" y="140" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="middle">por si se te olvida</text>
      <text x="82" y="165" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">te amo</text>
      <path d="M125,158 C125,152 118,147 113,152 C108,157 110,163 125,173 C140,163 142,157 137,152 C132,147 125,152 125,158 Z" fill="#e8295b"/>
    </g>
  </g>
</svg>
